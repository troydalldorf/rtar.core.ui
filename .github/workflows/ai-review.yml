# Calls the estate's reviewer, which lives in rtar.infra so it exists once. What this repository cares
# about is in AGENTS.md (or CLAUDE.md), which the reviewer reads. Needs the OPENAI_API_KEY secret here.
name: AI review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: troydalldorf/rtar.infra/.github/workflows/ai-review.yml@main
    # By name, not inherit: the reviewer reads these three and nothing else (rtar.infra#40).
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
