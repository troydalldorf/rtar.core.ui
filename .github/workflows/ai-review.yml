# Calls the estate's reviewer, which lives in rtar.infra so it exists once. What this repository cares
# about is in AGENTS.md (or CLAUDE.md), which the reviewer reads. Needs the OPENAI_API_KEY secret here.
name: AI review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: troydalldorf/rtar.infra/.github/workflows/ai-review.yml@main
    secrets: inherit
